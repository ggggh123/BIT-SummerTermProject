[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_backend"

[project]
name = "evml"
version = "0.1.0"
description = "EV charging station load forecasting — Ridge + seasonal-naive baseline"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
