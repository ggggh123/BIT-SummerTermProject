# =============================================================================
# 正式规模生成配置（#4 SCML）
# =============================================================================
# 参数对齐《04-SCML》§2.2「数据规模与结构」与 §6「验收标准」：
#   订单 ≥ 10 万、遥测 ≥ 100 万、站点 ≤ 10，同种子重跑哈希一致。
#
# `start_date` 的取值理由（**冻结决策，改动需通知全组**）：
#   窗口 = [start_date, start_date + history_days)。取 `2026-06-17` 时窗口为
#   2026-06-17 → 2026-09-14，**末日正好是答辩演示日**，大屏上的「近 90 天」
#   才落在人看得懂的日期区间里。若沿用早期草稿的 `2026-09-01`，90 天会伸到
#   2026-11-29（未来），前端所有日期轴与「至今」口径都会显得荒谬。
#
# `telemetry_count` 的口径冻结（原 T2 待办，见 docs/management/part2-scml-status.md）：
#   取 100 万条 **5 分钟级**采样帧。《04-SCML》§2.2 明确「按 5 分钟级采样（与 100 万条
#   规模自洽；若改分钟级需提量至千万级）」——即设计文档已经给出结论：5 分钟级 + 100 万。
#   全员按 100 万对齐；如需分钟级精度，须同步把规模提到千万级并重新评估生成耗时
#   与 HDFS 容量，不是改一个数字的事。
# =============================================================================

